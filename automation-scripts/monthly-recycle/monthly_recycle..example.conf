# ============================================================
# MONTHLY RECYCLE CONFIGURATION
# ============================================================

# Required
WORK_DIR="/path/to/digital-independence"
SERVICES="service1 service2 service3"

# Logging
LOG_DIR="/path/to/digital-independence/logs/monthly_recycle"
CLEANUP_LOGS_DAYS=60

# Notifications
ENABLE_NTFY="true"
NTFY_URL="https://ntfy.sh"
NTFY_TOPIC="CHANGE_ME_NTFY_TOPIC"
NTFY_TOKEN="CHANGE_ME_NTFY_TOKEN"

# Optional
RUN_YOURLS_FRONTEND_AFTER="false"
RUN_APT_UPDATE="false"
AUTO_REBOOT="false"