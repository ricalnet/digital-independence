services:
  caddy:
    image: git.ricalnet.my.id/rical/caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 128m
    cpus: 0.3
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stop_grace_period: 30s
    stop_signal: SIGTERM

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
