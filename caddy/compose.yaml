services:
  caddy:
    image: git.ricalnet.my.id/rical/caddy:2-alpine
    container_name: caddy
    restart: unless-stopped

    network_mode: host

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    environment:
      - TZ=${TZ:-Asia/Jakarta}

    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s
    stop_signal: SIGTERM

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
