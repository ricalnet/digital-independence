services:
  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:latest}
    container_name: uptime-kuma
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:9442:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_HOST=0.0.0.0
      - DEBUG=false
      - NODE_OPTIONS=--max-old-space-size=350
    networks:
      - monitoring_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  uptime_kuma_data:
    name: uptime_kuma_data
    driver: local

networks:
  monitoring_network:
    driver: bridge
    name: uptime_monitoring
    internal: true
