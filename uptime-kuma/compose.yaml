services:
  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-docker.io/louislam/uptime-kuma:latest}
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_BIND_ADDRESS:-127.0.0.1}:${UPTIME_KUMA_PORT:-9442}:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - NODE_ENV=production
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_HOST=0.0.0.0
      - DEBUG=${DEBUG:-false}
      - NODE_OPTIONS=--max-old-space-size=350
      - SKIP_CHOWN=true
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.6
    pids_limit: 200
    mem_swappiness: 10
    oom_score_adj: -100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
      - /run:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - monitoring_network

volumes:
  uptime_kuma_data:
    name: uptime_kuma_data

networks:
  monitoring_network:
    name: uptime_monitoring
    driver: bridge