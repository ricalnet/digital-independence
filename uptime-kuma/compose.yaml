services:
  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-docker.io/louislam/uptime-kuma:latest}
    container_name: uptime-kuma
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:9442:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_HOST=0.0.0.0
      - DEBUG=${DEBUG}
      - NODE_OPTIONS=--max-old-space-size=350
      - SKIP_CHOWN=true
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    security_opt:
      - label=disable
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    stop_signal: SIGTERM
    stop_timeout: 30

volumes:
  uptime_kuma_data:
    name: uptime_kuma_data

networks:
  monitoring_network:
    driver: bridge
    name: uptime_monitoring
