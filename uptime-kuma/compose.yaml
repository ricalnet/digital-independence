services:
  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:latest}
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:9442:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_HOST=0.0.0.0
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime_kuma_data:
    name: uptime_kuma_data
    driver: local

networks:
  monitoring_network:
    driver: bridge
    name: uptime_monitoring
