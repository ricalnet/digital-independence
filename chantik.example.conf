# Example backup configuration for Digital Independence
# Copy to backup.conf and edit as needed

# ============================================
# GENERAL SETTINGS
# ============================================

# Main backup directory
BACKUP_DIR="/backup"

# Prefix for backup filenames
BACKUP_PREFIX="dipen"

# Number of backups to keep
BACKUP_RETENTION=7

# ============================================
# DIRECTORIES TO BACKUP
# ============================================

# Custom directories to backup (space-separated)
# Example: "/etc/nginx /var/www /home/user/data"
CUSTOM_DIRS="/path/to/digital-independence"

# ============================================
# PODMAN VOLUMES TO BACKUP
# ============================================

# Podman volumes to backup (space-separated)
# Leave empty to backup all volumes
# Example: "nextcloud_data immich_postgres jellyfin_config"
PODMAN_VOLUMES="nextcloud_data \
immich_postgres \
jellyfin_config"

# ============================================
# ENCRYPTION
# ============================================

# Encryption password (leave empty for interactive prompt)
# WARNING: Storing password in config file is less secure
ENCRYPTION_PASSWORD=""

# ============================================
# NTFY NOTIFICATIONS
# ============================================

# NTFY server URL (leave empty to disable)
NTFY_URL="https://ntfy.sh"

# NTFY topic for notifications
NTFY_TOPIC="dipen-backup"

# NTFY authentication token (optional)
NTFY_TOKEN=""

# ============================================
# INCREMENTAL BACKUP SETTINGS
# ============================================

# Directory for incremental metadata
INCREMENTAL_DIR="${BACKUP_DIR}/.incremental"

# Use hardlink for incremental backup
USE_HARDLINK=true