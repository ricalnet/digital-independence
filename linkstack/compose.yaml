services:
  linkstack:
    hostname: "linkstack"
    image: "linkstackorg/linkstack:latest"
    container_name: linkstack
    environment:
      TZ: ${TZ}
      SERVER_ADMIN: ${SERVER_ADMIN}
      HTTP_SERVER_NAME: ${HTTP_SERVER_NAME}
      HTTPS_SERVER_NAME: ${HTTPS_SERVER_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      UPLOAD_MAX_FILESIZE: ${UPLOAD_MAX_FILESIZE}
    volumes:
      - linkstack_data:/htdocs
      - linkstack_php:/usr/local/etc/php/conf.d
    ports:
      - "${HTTP_PORT:-8003}:80"
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - linkstack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: linkstack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - linkstack-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  linkstack-network:
    driver: bridge

volumes:
  linkstack_data:
    name: linkstack_web_data
  linkstack_php:
    name: linkstack_php_config
  mysql_data:
    name: linkstack_mysql_data
