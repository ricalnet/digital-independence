services:
  yourls:
    image: ${YOURLS_IMAGE:-docker.io/yourls:apache}
    container_name: yourls
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${YOURLS_BIND_ADDRESS:-127.0.0.1}:${YOURLS_PORT:-8001}:8080"
    environment:
      - YOURLS_SITE=${YOURLS_SITE:-https://localhost:8001}
      - YOURLS_USER=${YOURLS_USER:-admin}
      - YOURLS_PASS=${YOURLS_PASS}
      - YOURLS_DB_HOST=mysql
      - YOURLS_DB_USER=${YOURLS_DB_USER:-yourls}
      - YOURLS_DB_PASS=${YOURLS_DB_PASS}
      - YOURLS_DB_NAME=${YOURLS_DB_NAME:-yourls}
      - YOURLS_DB_PREFIX=${YOURLS_DB_PREFIX:-yourls_}
      - YOURLS_PRIVATE=true
      - YOURLS_HTTPS=true
      - YOURLS_UNIQUE_URLS=true
      - YOURLS_COOKIEKEY=${YOURLS_COOKIEKEY}
    volumes:
      - yourls_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=32M
      - /var/run:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - yourls-network

  mysql:
    image: ${MYSQL_IMAGE:-docker.io/mysql:8.0}
    container_name: yourls-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${YOURLS_DB_NAME:-yourls}
      MYSQL_USER: ${YOURLS_DB_USER:-yourls}
      MYSQL_PASSWORD: ${YOURLS_DB_PASS}
    volumes:
      - yourls_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - yourls-network

volumes:
  yourls_data:
    name: yourls_data
  yourls_mysql_data:
    name: yourls_mysql_data

networks:
  yourls-network:
    name: yourls_network
    driver: bridge