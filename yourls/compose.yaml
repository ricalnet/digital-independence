name: yourls

services:
  nginx:
    image: docker.io/nginx:alpine
    container_name: yourls-nginx
    restart: unless-stopped
    depends_on:
      yourls:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - yourls-data:/var/www/html:ro
    networks:
      - yourls-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  yourls:
    image: ${YOURLS_IMAGE:-docker.io/yourls:1.10.4-fpm-alpine}
    container_name: yourls-fpm
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      YOURLS_DB_HOST: mysql
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: ${YOURLS_DB_PASSWORD}
      YOURLS_DB_NAME: yourls
      YOURLS_SITE: ${YOURLS_SITE:-http://localhost:8001}
      YOURLS_USER: ${YOURLS_ADMIN_USER:-admin}
      YOURLS_PASS: ${YOURLS_ADMIN_PASSWORD}
      YOURLS_HOURS_OFFSET: ${YOURLS_HOURS_OFFSET:-0}
      YOURLS_LANG: ${YOURLS_LANG:-id_ID}
      YOURLS_UNIQUE_URLS: ${YOURLS_UNIQUE_URLS:-true}
      YOURLS_PRIVATE: ${YOURLS_PRIVATE:-true}
      YOURLS_COOKIEKEY: ${YOURLS_COOKIEKEY}
      DEBUG: ${DEBUG}
    volumes:
      - yourls-config:/var/www/html/user
      - yourls-data:/var/www/html
    networks:
      - yourls-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 256m

  mysql:
    image: ${YOURLS_MYSQL_IMAGE:-docker.io/mysql:8.0}
    container_name: yourls-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yourls
      MYSQL_USER: yourls
      MYSQL_PASSWORD: ${YOURLS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - yourls-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m

networks:
  yourls-network:
    driver: bridge
    name: yourls-network

volumes:
  mysql-data:
    driver: local
    name: yourls-mysql-data
  yourls-config:
    driver: local
    name: yourls-config
  yourls-data:
    driver: local
    name: yourls-data
