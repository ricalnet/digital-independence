name: immich

services:
  immich-server:
    container_name: immich_server
    image: ${IMMICH_SERVER_IMAGE:-ghcr.io/immich-app/immich-server:release}
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION:-./data}:/data:rw
    env_file:
      - .env
    ports:
      - "${IMMICH_BIND_ADDRESS:-127.0.0.1}:${IMMICH_PORT:-2283}:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2283/server-info/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 500
    mem_swappiness: 10
    oom_score_adj: -100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - SYS_CHROOT
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
      - /run:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    networks:
      - immich-network
    stop_grace_period: 60s
    stop_signal: SIGTERM
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ${IMMICH_ML_IMAGE:-ghcr.io/immich-app/immich-machine-learning:release}
    restart: unless-stopped
    volumes:
      - model-cache:/cache:rw
    env_file:
      - .env
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:2283/ping')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2.0
    pids_limit: 300
    mem_swappiness: 10
    oom_score_adj: -50
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1G
      - /run:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    networks:
      - immich-network
    stop_grace_period: 60s
    stop_signal: SIGTERM

  redis:
    container_name: immich_redis
    image: ${REDIS_IMAGE:-docker.io/valkey/valkey:alpine}
    restart: unless-stopped
    command: >
      redis-server
      --bind 0.0.0.0
      --port 6379
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-IMMICH_CONFIG}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 100
    mem_swappiness: 0
    oom_score_adj: -800
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
    volumes:
      - redis-data:/data:rw
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        compress: "true"
    networks:
      - immich-network
    stop_grace_period: 30s
    stop_signal: SIGTERM

  database:
    container_name: immich_postgres
    image: ${POSTGRES_IMAGE:-ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_SHARED_BUFFERS: ${DB_SHARED_BUFFERS:-512MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${DB_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${DB_MAINTENANCE_WORK_MEM:-128MB}
      POSTGRES_WORK_MEM: ${DB_WORK_MEM:-32MB}
      POSTGRES_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-100}
    volumes:
      - immich-postgres:/var/lib/postgresql/data:rw
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME} -h localhost -p 5432"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 300
    mem_swappiness: 10
    oom_score_adj: -500
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - FOWNER
    tmpfs:
      - /run:rw,noexec,nosuid,size=64M
      - /tmp:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    networks:
      - immich-network
    stop_grace_period: 60s
    stop_signal: SIGTERM

volumes:
  immich-postgres:
    name: immich_postgres
  model-cache:
    name: immich_model_cache
  redis-data:
    name: immich_redis_data

networks:
  immich-network:
    name: immich-network
    driver: bridge