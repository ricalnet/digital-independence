# ============================================
# DNSCRYPT-PROXY CONFIGURATION TEMPLATE
# ============================================
# 
# INSTRUCTIONS:
# 1. Copy this file to dnscrypt-proxy.toml
# 2. Replace all values marked <YOUR_...> with your choices
# 3. Find server stamps from the public list at:
#    https://github.com/DNSCrypt/dnscrypt-resolvers/blob/master/v3/public-resolvers.md
#
# IMPORTANT:
# - DO NOT use the actual stamps from this template!
# - Choose relays closest to your geographical location
# ============================================

# ============================================
# LISTEN & NETWORK
# ============================================
listen_addresses = ['0.0.0.0:5053']
max_clients = 250
ipv4_servers = true
ipv6_servers = false
force_tcp = false
timeout = 5000
keepalive = 30

# ============================================
# SERVER SELECTION
# ============================================
dnscrypt_servers = true
doh_servers = true
lb_estimator = true
lb_strategy = 'p2'

# ============================================
# FALLBACK RESOLVER
# ============================================
fallback_resolver = '9.9.9.9:53'
ignore_system_dns = true

# ============================================
# SERVER NAMES
# ============================================
# Replace with your preferred servers from the public list
server_names = [
    '<YOUR_PREFERRED_SERVER_1>',
    '<YOUR_PREFERRED_SERVER_2>',
    '<YOUR_PREFERRED_SERVER_3>',
    # Add more servers if needed
]

# ============================================
# SECURITY & PRIVACY
# ============================================
require_dnssec = true
require_nolog = true
require_nofilter = true

dnscrypt_ephemeral_keys = true
tls_disable_session_tickets = true
tls_cipher_suite = [4865, 4866, 4867]
cert_refresh_delay = 240
edns_payload_size = 1452

# ============================================
# LOGGING
# ============================================
# Log level: 0=ERROR, 1=WARNING, 2=NOTICE, 3=INFO, 4=DEBUG
log_level = 0
use_syslog = true
log_file = '/dev/null'

# ============================================
# STATIC SERVERS
# ============================================
# Replace with your own server stamps from:
# https://github.com/DNSCrypt/dnscrypt-resolvers/blob/master/v3/public-resolvers.md
#
# Correct format example:
# [static.'your-server-name']
# stamp = 'sdns://...'  # Copy stamp from the public list

[static]
  # === EXAMPLE SERVER 1 ===
  # [static.'your-server-1']
  # stamp = 'sdns://<YOUR_STAMP_HERE>'

  # === EXAMPLE SERVER 2 ===
  # [static.'your-server-2']
  # stamp = 'sdns://<YOUR_STAMP_HERE>'

# ============================================
# ANONYMIZED DNS
# ============================================
# This feature allows anonymization via relay servers.
# HOW TO USE:
# 1. Choose relay servers from the public list
# 2. Ensure relay servers are added to [static]
# 3. Uncomment and adjust the configuration below
# 4. Replace 'your-resolver' and 'your-relay' with your servers

# [anonymized_dns]
# routes = [
#     { server_name='your-resolver-1', via=['your-relay-1', 'your-relay-2'] },
#     { server_name='your-resolver-2', via=['your-relay-1', 'your-relay-2'] },
# ]

skip = ['your-relay-1', 'your-relay-2']

# ============================================
# SOURCES - Public Resolvers (Auto-update)
# ============================================
[sources.'public-resolvers']
urls = [
    'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
    'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
    'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md'
]
minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
cache_file = 'public-resolvers.md'
refresh_delay = 72

# ============================================
# CACHE
# ============================================
[cache]
size = 20000
min_ttl = 600
max_ttl = 86400
negative_min_ttl = 60
negative_max_ttl = 1800
prefetch = true
prefetch_ttl = 7200

# ============================================
# QUERY LOGGING
# ============================================
[query_log]
file = '/dev/null'
format = 'tsv'

# ============================================
# BLOCKING (IPv6)
# ============================================
[blocking]
block_ipv6 = false

# ============================================
# IP ENCRYPTION
# ============================================
# Generate a new key using: openssl rand -hex 16
[ip_encryption]
algorithm = "ipcrypt-nd"
key = "your-secret-key"