services:
  postgresql:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: authentik
    volumes:
      - postgresql:/var/lib/postgresql
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    pids_limit: 200
    mem_swappiness: 10
    oom_score_adj: -500

  redis:
    image: ${REDIS_IMAGE:-docker.io/redis:alpine}
    restart: unless-stopped
    command: --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis:/data
    networks:
      - authentik
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    pids_limit: 100
    mem_swappiness: 0
    oom_score_adj: -800

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:latest}
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_WORKERS: "4"
      AUTHENTIK_WEB__WORKERS: "4"
      AUTHENTIK_DEFAULT__CACHE_TIMEOUT: "300"
      AUTHENTIK_TASK__CELERYD_PREFETCH_MULTIPLIER: "1"
      AUTHENTIK_TASK__CELERYD_MAX_TASKS_PER_CHILD: "1000"
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    volumes:
      - media:/media
      - custom-templates:/templates
      - certs:/certs
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /run:size=64M
      - /var/run:size=64M
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    pids_limit: 500
    mem_swappiness: 10
    oom_score_adj: 0
    cpu_period: 100000
    cpu_quota: 200000

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:latest}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_TASK__CELERYD_MAX_TASKS_PER_CHILD: "100"
    volumes:
      - media:/media
      - certs:/certs
      - custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=128M
      - /run:size=64M
      - /var/run:size=64M
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    pids_limit: 300
    mem_swappiness: 10
    oom_score_adj: -100

networks:
  authentik:
    driver: bridge
    internal: true

volumes:
  postgresql:
    name: authentik_postgresql
  redis:
    name: authentik_redis
  media:
    name: authentik_media
  certs:
    name: authentik_certs
  custom-templates:
    name: authentik_templates