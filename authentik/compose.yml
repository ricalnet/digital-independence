services:
  postgresql:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:18-alpine}
    container_name: authentik_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: authentik
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - postgresql:/var/lib/postgresql
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    mem_reservation: 256m
    memswap_limit: 1.2g
    cpus: 0.8
    pids_limit: 200
    oom_score_adj: -500
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - NET_BIND_SERVICE
      - SYS_CHROOT
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /var/run/postgresql:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 60s
    stop_signal: SIGTERM

  redis:
    image: ${REDIS_IMAGE:-docker.io/redis:alpine}
    container_name: authentik_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-AUTHENTIK_CONFIG}"
    volumes:
      - redis:/data
    networks:
      - authentik
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 320m
    mem_reservation: 64m
    memswap_limit: 320m
    cpus: 0.3
    pids_limit: 100
    oom_score_adj: -800
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stop_grace_period: 30s
    stop_signal: SIGTERM

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:latest}
    container_name: authentik_server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_WORKERS: "2"
      AUTHENTIK_WEB__WORKERS: "2"
      AUTHENTIK_DEFAULT__CACHE_TIMEOUT: "300"
      AUTHENTIK_TASK__CELERYD_PREFETCH_MULTIPLIER: "1"
      AUTHENTIK_TASK__CELERYD_MAX_TASKS_PER_CHILD: "1000"
    ports:
      - "127.0.0.1:${COMPOSE_PORT_HTTP:-9000}:9000"
      - "127.0.0.1:${COMPOSE_PORT_HTTPS:-9443}:9443"
    volumes:
      - media:/media
      - custom-templates:/templates
      - certs:/certs
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik
    mem_limit: 1g
    mem_reservation: 256m
    memswap_limit: 1.2g
    cpus: 1.0
    pids_limit: 500
    oom_score_adj: 0
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
      - /run:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 60s
    stop_signal: SIGTERM

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:latest}
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_TASK__CELERYD_MAX_TASKS_PER_CHILD: "100"
    volumes:
      - media:/media
      - certs:/certs
      - custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik
    mem_limit: 768m
    mem_reservation: 192m
    memswap_limit: 896m
    cpus: 0.8
    pids_limit: 300
    oom_score_adj: -100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
      - /run:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 60s
    stop_signal: SIGTERM

networks:
  authentik:
    driver: bridge
    internal: true

volumes:
  postgresql:
    name: authentik_postgresql
  redis:
    name: authentik_redis
  media:
    name: authentik_media
  certs:
    name: authentik_certs
  custom-templates:
    name: authentik_templates
