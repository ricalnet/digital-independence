services:
  dash:
    image: docker.io/mauricenino/dashdot:latest
    container_name: dashdot
    restart: unless-stopped
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: "true"
    ports:
      - "3001:3001"
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
