services:
  dash:
    image: ${DASHDOT_IMAGE:-docker.io/mauricenino/dashdot:latest}
    container_name: dashdot
    restart: unless-stopped
    environment:
      - DASHDOT_ENABLE_CPU_TEMPS=${DASHDOT_ENABLE_CPU_TEMPS:-true}
      - DASHDOT_ENABLE_GPU_TEMPS=${DASHDOT_ENABLE_GPU_TEMPS:-true}
      - DASHDOT_ENABLE_DOCKER=${DASHDOT_ENABLE_DOCKER:-true}
      - DASHDOT_PORT=${DASHDOT_PORT:-3001}
      - DASHDOT_HOST=${DASHDOT_HOST:-0.0.0.0}
      - DASHDOT_LOG_LEVEL=${DASHDOT_LOG_LEVEL:-info}
      - DASHDOT_THEME=${DASHDOT_THEME:-dark}
    ports:
      - "${DASHDOT_BIND_ADDRESS:-127.0.0.1}:${DASHDOT_PORT:-3001}:3001"
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=32M
      - /var/run:rw,noexec,nosuid,size=32M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - dashdot-network

networks:
  dashdot-network:
    name: dashdot_network
    driver: bridge