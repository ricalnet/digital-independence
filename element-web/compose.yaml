services:
  element-web:
    image: ${ELEMENT_WEB_IMAGE:-docker.io/vectorim/element-web:latest}
    container_name: element-web
    restart: unless-stopped
    ports:
      - "${ELEMENT_WEB_BIND_ADDRESS:-127.0.0.1}:${ELEMENT_WEB_PORT:-8009}:80"
    volumes:
      - ./config/element-web-config.json:/app/config.json:ro
      - ./modules:/modules:ro
      - element-nginx-conf:/etc/nginx/conf.d
      - element-nginx-templates:/etc/nginx/templates
    environment:
      - ELEMENT_WEB_PORT=80
      - NODE_ENV=production
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
      - NGINX_KEEPALIVE_TIMEOUT=${NGINX_KEEPALIVE_TIMEOUT:-65}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-10M}
      - ELEMENT_WEB_SECURITY_HEADERS=${ELEMENT_WEB_SECURITY_HEADERS:-1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.8
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /var/cache/nginx:rw,noexec,nosuid,size=128M
      - /var/log/nginx:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=32M
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - element-network

networks:
  element-network:
    driver: bridge
    name: element-network

volumes:
  element-nginx-conf:
    name: element_nginx_conf
  element-nginx-templates:
    name: element_nginx_templates