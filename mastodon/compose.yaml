services:
  db:
    restart: always
    image: ${MASTODON_DB_IMAGE:-postgres:18-alpine}
    container_name: mastodon_db
    shm_size: 256mb
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-mastodon_production}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    image: ${MASTODON_REDIS_IMAGE:-redis:alpine}
    container_name: mastodon_redis
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${MASTODON_WEB_IMAGE:-ghcr.io/mastodon/mastodon:latest}
    restart: always
    container_name: mastodon_web
    env_file: .env.production
    command: bundle exec puma -C config/puma.rb
    networks:
      - external_network
      - internal_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:${WEB_PORT:-4001}:3000"
    depends_on:
      - db
      - redis
    volumes:
      - mastodon_system:/mastodon/public/system
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  streaming:
    image: ${MASTODON_STREAMING_IMAGE:-ghcr.io/mastodon/mastodon-streaming:latest}
    restart: always
    container_name: mastodon_streaming
    env_file: .env.production
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:${STREAMING_PORT:-4000}:4000"
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sidekiq:
    image: ${MASTODON_SIDEKIQ_IMAGE:-ghcr.io/mastodon/mastodon:latest}
    restart: always
    container_name: mastodon_sidekiq
    env_file: .env.production
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - mastodon_system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ## Uncomment to enable federation with tor instances along with adding the following ENV variables
  ## http_hidden_proxy=http://privoxy:8118
  ## ALLOW_ACCESS_TO_HIDDEN_SERVICE=true
