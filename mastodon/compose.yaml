networks:
  external_network:
    name: mastodon_external
  internal_network:
    name: mastodon_internal
    internal: true

volumes:
  postgres_data:
    name: mastodon_postgres_data
  redis_data:
    name: mastodon_redis_data
  mastodon_system:
    name: mastodon_system_data
