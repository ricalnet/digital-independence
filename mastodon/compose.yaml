services:
  db:
    restart: always
    image: postgres:15-alpine
    container_name: mastodon_db
    shm_size: 256mb
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    image: redis:alpine
    container_name: mastodon_redis
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/mastodon/mastodon:v4.6.2
    restart: always
    container_name: mastodon_web
    env_file: .env.production
    command: bundle exec puma -C config/puma.rb
    networks:
      - external_network
      - internal_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:${WEB_PORT:-4001}:3000"
    depends_on:
      - db
      - redis
    volumes:
      - mastodon_system:/mastodon/public/system
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.6.2
    restart: always
    container_name: mastodon_streaming
    env_file: .env.production
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:${STREAMING_PORT:-4000}:4000"
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.6.2
    restart: always
    container_name: mastodon_sidekiq
    env_file: .env.production
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - mastodon_system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ## Uncomment to enable federation with tor instances along with adding the following ENV variables
  ## http_hidden_proxy=http://privoxy:8118
  ## ALLOW_ACCESS_TO_HIDDEN_SERVICE=true
