services:
  homarr:
    container_name: homarr
    image: ${HOMARR_IMAGE:-ghcr.io/homarr-labs/homarr:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    cap_drop:
      - ALL
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/podman.sock:ro
      - homarr_data:/appdata
      - homarr_nginx:/var/lib/nginx
      - homarr_nginx_conf:/etc/nginx
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - DOCKER_SOCKET_PATHS=/var/run/podman.sock
    ports:
      - "${HOMARR_BIND_ADDRESS:-127.0.0.1}:${HOMARR_PORT:-7575}:7575"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:7575/api/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    mem_swappiness: 10
    oom_score_adj: -100
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
      - /var/cache/nginx:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - homarr-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: homarr-redis
    image: ${REDIS_IMAGE:-docker.io/redis:alpine}
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec 
      --save 60 1 
      --requirepass ${REDIS_PASSWORD}
      --dir /data
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-HOMARR_CONFIG}"
    volumes:
      - homarr_redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 50
    mem_swappiness: 0
    oom_score_adj: -800
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    networks:
      - homarr-network
    stop_grace_period: 30s

volumes:
  homarr_data:
    name: homarr_data
  homarr_redis_data:
    name: homarr_redis_data
  homarr_nginx:
    name: homarr_nginx
  homarr_nginx_conf:
    name: homarr_nginx_conf

networks:
  homarr-network:
    name: homarr-network
    driver: bridge