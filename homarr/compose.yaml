services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homarr_data:/appdata
    env_file:
      - .env
    ports:
      - "127.0.0.1:7575:7575"

volumes:
  homarr_data:
    name: homarr_data
