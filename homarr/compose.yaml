services:
  homarr:
    container_name: homarr
    image: ${HOMARR_IMAGE:-ghcr.io/homarr-labs/homarr:latest}
    user: "1000:1000"
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/podman.sock:ro
      - homarr_data:/appdata
      - homarr_nginx:/var/lib/nginx
      - homarr_nginx_conf:/etc/nginx
    env_file:
      - .env
    ports:
      - "127.0.0.1:7575:7575"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "next-server"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - homarr-network
    stop_grace_period: 30s
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: homarr-redis
    image: redis:alpine
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec 
      --save 60 1 
      --requirepass ${REDIS_PASSWORD:-}
      --dir /data
    volumes:
      - homarr_redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    networks:
      - homarr-network
    security_opt:
      - no-new-privileges:true

volumes:
  homarr_data:
    name: homarr_data
  homarr_redis_data:
    name: homarr_redis_data
  homarr_nginx:
    name: homarr_nginx
  homarr_nginx_conf:
    name: homarr_nginx_conf

networks:
  homarr-network:
    name: homarr-network
    driver: bridge
