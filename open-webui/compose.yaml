services:
  openwebui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_BIND_ADDRESS:-127.0.0.1}:${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - openwebui-data:/app/backend/data
      - openwebui-static:/app/backend/open_webui/static
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=${WEBUI_NAME:-My AI Assistant}
      - WEBUI_URL=${WEBUI_URL}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SESSION_STORE_TYPE=${SESSION_STORE_TYPE:-redis}
      - RATE_LIMIT_STORE_TYPE=${RATE_LIMIT_STORE_TYPE:-redis}
      - HF_TOKEN=${HF_TOKEN:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-false}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-false}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}
      - ENABLE_PASSWORD_AUTH=${ENABLE_PASSWORD_AUTH:-true}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-https://${DOMAIN:-localhost}}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY:-true}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
      - CSP_ENABLED=${CSP_ENABLED:-true}
      - WORKERS=${WORKERS:-4}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - TIMEOUT_KEEP_ALIVE=${TIMEOUT_KEEP_ALIVE:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_DEBUG_LOGS=${ENABLE_DEBUG_LOGS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 500
    mem_swappiness: 10
    oom_score_adj: -100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - openwebui-network
    stop_grace_period: 60s
    stop_signal: SIGTERM
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: redis
    image: ${REDIS_IMAGE:-docker.io/redis:alpine}
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD} 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --dir /data
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-OPENWEBUI_CONFIG}"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    pids_limit: 100
    mem_swappiness: 0
    oom_score_adj: -800
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - openwebui-network
    stop_grace_period: 30s
    stop_signal: SIGTERM

