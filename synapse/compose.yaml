services:
  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    container_name: synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8008:8008"
      - "127.0.0.1:8448:8448"
    volumes:
      - synapse_data:/data
    environment:
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME:-matrix.yourdomain.com}
      - SYNAPSE_REPORT_STATS=${SYNAPSE_REPORT_STATS:-no}
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - SYNAPSE_POSTGRES_HOST=postgres
      - SYNAPSE_POSTGRES_USER=${SYNAPSE_POSTGRES_USER:-synapse}
      - SYNAPSE_POSTGRES_PASSWORD=${SYNAPSE_POSTGRES_PASSWORD?err}
      - SYNAPSE_POSTGRES_DB=${SYNAPSE_POSTGRES_DB:-synapse}
    networks:
      - matrix-network
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    user: "991:991"

  postgres:
    image: ${SYNAPSE_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synapse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?err}
      - POSTGRES_DB=${POSTGRES_DB:-synapse}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - matrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

volumes:
  synapse_data:
    driver: local
  postgres_data:
    driver: local

networks:
  matrix-network:
    external: true
    name: matrix-network
    driver: bridge
