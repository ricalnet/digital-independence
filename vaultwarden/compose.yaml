services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-docker.io/vaultwarden/server:alpine}
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vaultwarden_data:/data/
    ports:
      - "${VAULTWARDEN_BIND_ADDRESS:-127.0.0.1}:${VAULTWARDEN_PORT:-8000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/alive || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.8
    pids_limit: 200
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
      - /run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - vaultwarden_network
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - USE_SESSION_STORE=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - INVITATIONS_ALLOWED=${INVITATIONS_ALLOWED:-false}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - SIGNUPS_VERIFY=${SIGNUPS_VERIFY:-true}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ROCKET_PORT=80
      - ROCKET_WORKERS=${ROCKET_WORKERS:-4}
      - ROCKET_KEEP_ALIVE=${ROCKET_KEEP_ALIVE:-30}
      - ROCKET_LIMITS={json=10485760, forms=10485760}
      - DATABASE_MAX_CONNECTIONS=${DATABASE_MAX_CONNECTIONS:-10}
      - DATABASE_TIMEOUT=${DATABASE_TIMEOUT:-30}
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-false}
      - DISABLE_ICON_DOWNLOAD=${DISABLE_ICON_DOWNLOAD:-false}
      - IP_HEADER=${IP_HEADER:-X-Forwarded-For}
      - ENABLE_DB_WAL=${ENABLE_DB_WAL:-true}
      - EXTENDED_LOGGING=${EXTENDED_LOGGING:-false}
    stop_grace_period: 30s

  redis:
    image: ${REDIS_IMAGE:-docker.io/redis:alpine}
    container_name: vaultwarden_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-VAULTWARDEN_CONFIG}"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - vaultwarden_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.3
    pids_limit: 50
    oom_score_adj: -800
    stop_grace_period: 30s

volumes:
  vaultwarden_data:
    name: vaultwarden_data
  redis_data:
    name: vaultwarden_redis_data

networks:
  vaultwarden_network:
    name: vaultwarden_network
    driver: bridge