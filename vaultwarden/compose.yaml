services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:alpine}
    container_name: vaultwarden
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vaultwarden_data:/data/
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=64M
    mem_swappiness: 0
    oom_score_adj: -500
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - vaultwarden_network
    depends_on:
      - redis
    environment:
      - USE_SESSION_STORE=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379

  redis:
    image: redis:alpine
    container_name: vaultwarden_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - vaultwarden_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.25"

volumes:
  vaultwarden_data:
    name: vaultwarden_data
  redis_data:
    name: vaultwarden_redis_data

networks:
  vaultwarden_network:
    name: vaultwarden_network
    driver: bridge
