# Rate limiting zone
limit_req_zone $binary_remote_addr zone=nextcloud:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html /index.php;

    # Limit request body size
    client_max_body_size 10G;
    client_body_timeout 3600s;
    client_header_timeout 60s;
    client_body_buffer_size 128k;

    # FastCGI timeouts
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;
    fastcgi_buffers 64 4K;
    fastcgi_buffer_size 8k;
    fastcgi_busy_buffers_size 16k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # Rate limiting
    limit_req zone=nextcloud burst=20 nodelay;

    # Block access to sensitive files
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
        deny all;
        return 403;
    }

    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        deny all;
        return 403;
    }

    # .well-known
    location ^~ /.well-known {
        location = /.well-known/carddav  { return 301 /remote.php/dav/; }
        location = /.well-known/caldav   { return 301 /remote.php/dav/; }
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Handle .mjs files
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;

        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;

        fastcgi_pass app:9000;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;

        # Security for PHP
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp:/usr/share/php:/usr/local/lib/php";
    }

    # Static files caching
    location ~ \.(?:css|js|svg|gif|png|jpg|ico|wasm|tflite|map)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Fonts caching
    location ~ \.woff2?$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Redirects
    location /remote {
        return 301 /remote.php$request_uri;
    }

    location /dav {
        return 301 /remote.php/dav/$request_uri;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;
}
