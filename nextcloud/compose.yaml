services:
  db:
    image: ${NEXTCLOUD_DB_IMAGE:-mariadb:11.8-ubi9}
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-read-only=0 --innodb-flush-log-at-trx-commit=2 --innodb-buffer-pool-size=512M
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nextcloud-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - SYS_RESOURCE

  redis:
    image: ${NEXTCLOUD_REDIS_IMAGE:-redis:alpine}
    user: "999:999"
    container_name: nextcloud_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nextcloud-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  app:
    image: ${NEXTCLOUD_APP_IMAGE:-nextcloud:stable-fpm}
    container_name: nextcloud_app
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
      - ${EXTERNAL_STORAGE_PATH}:${EXTERNAL_STORAGE_MOUNT}:rw
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_HOST: ${MYSQL_HOST}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      EXTERNAL_STORAGE_PATH: ${EXTERNAL_STORAGE_MOUNT}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${OVERWRITEHOST}
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_REVALIDATE_FREQUENCY: 2
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nextcloud-network

  web:
    image: ${NEXTCLOUD_WEB_IMAGE:-nginx:alpine}
    container_name: nextcloud_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"
    volumes:
      - nextcloud_data:/var/www/html:ro
      - ${EXTERNAL_STORAGE_PATH}:${EXTERNAL_STORAGE_MOUNT}:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nextcloud-network

volumes:
  db_data:
    name: nextcloud_db_data
  redis_data:
    name: nextcloud_redis_data
  nextcloud_data:
    name: nextcloud_nextcloud_data

networks:
  nextcloud-network:
    driver: bridge
    internal: false
