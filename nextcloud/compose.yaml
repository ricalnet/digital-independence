services:
  db:
    image: ${NEXTCLOUD_DB_IMAGE:-mariadb:11.8-ubi9}
    container_name: nextcloud_db
    restart: unless-stopped
    command: >
      --transaction-isolation=READ-COMMITTED
      --binlog-format=ROW
      --innodb-read-only=0
      --innodb-flush-log-at-trx-commit=2
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --max-allowed-packet=64M
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 300
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - SYS_RESOURCE
      - NET_BIND_SERVICE
      - SYS_CHROOT
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
      - /run:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - nextcloud-network
    stop_grace_period: 60s

  redis:
    image: ${NEXTCLOUD_REDIS_IMAGE:-redis:alpine}
    container_name: nextcloud_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG "CONFIG_${REDIS_CONFIG_RENAME:-NEXTCLOUD_CONFIG}"
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=32M
      - /var/run:rw,noexec,nosuid,size=32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - nextcloud-network
    stop_grace_period: 30s

  app:
    image: ${NEXTCLOUD_APP_IMAGE:-nextcloud:stable-fpm}
    container_name: nextcloud_app
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
      # comment this part if you do not use external storage
      - ${EXTERNAL_STORAGE_PATH}:${EXTERNAL_STORAGE_MOUNT}:rw
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_HOST: db
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-10G}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-3600}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-10G}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      # comment this part if you do not use external storage
      EXTERNAL_STORAGE_PATH: ${EXTERNAL_STORAGE_MOUNT}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${OVERWRITEHOST}
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_REVALIDATE_FREQUENCY: 2
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      PHP_OPCACHE_MEMORY_CONSUMPTION: 256
      PHP_OPCACHE_INTERNED_STRINGS_BUFFER: 16
      PHP_OPCACHE_MAX_ACCELERATED_FILES: 10000
      PHP_OPCACHE_MAX_WASTED_PERCENTAGE: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 500
    security_opt:
      - no-new-privileges=true
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SYS_CHROOT
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
      - /run:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - nextcloud-network
    stop_grace_period: 60s

  web:
    image: ${NEXTCLOUD_WEB_IMAGE:-nginx:alpine}
    container_name: nextcloud_web
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_BIND_ADDRESS:-127.0.0.1}:${NEXTCLOUD_PORT:-5000}:80"
    volumes:
      - nextcloud_data:/var/www/html:ro
      # comment this part if you do not use external storage
      - ${EXTERNAL_STORAGE_PATH}:${EXTERNAL_STORAGE_MOUNT}:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /run:rw,noexec,nosuid,size=32M
      - /var/run:rw,noexec,nosuid,size=32M
      - /var/cache/nginx:rw,noexec,nosuid,size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - nextcloud-network
    stop_grace_period: 30s

volumes:
  db_data:
    name: nextcloud_db_data
  redis_data:
    name: nextcloud_redis_data
  nextcloud_data:
    name: nextcloud_nextcloud_data

networks:
  nextcloud-network:
    name: nextcloud_network
    driver: bridge