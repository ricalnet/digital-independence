services:
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:latest}
    container_name: ntfy-server
    user: "1000:1000"
    command: serve
    env_file:
      - .env
    volumes:
      - ntfy_data:/var/lib/ntfy
    ports:
      - "127.0.0.1:8010:80"
    restart: unless-stopped
    networks:
      - ntfy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ntfy_data:
    name: ntfy_data_volume

networks:
  ntfy-network:
    driver: bridge
