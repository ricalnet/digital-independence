services:
  ntfy:
    image: ${NTFY_IMAGE:-docker.io/binwiederhier/ntfy:latest}
    container_name: ntfy-server
    command: serve
    env_file:
      - .env
    ports:
      - "${NTFY_BIND_ADDRESS:-127.0.0.1}:${NTFY_PORT:-8010}:80"
    restart: unless-stopped
    networks:
      - ntfy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 100
    mem_swappiness: 10
    oom_score_adj: -100
    cpu_period: 100000
    cpu_quota: 50000
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /var/run:rw,noexec,nosuid,size=64M
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8010}
      - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-true}
      - NTFY_LOG_LEVEL=${NTFY_LOG_LEVEL:-info}
      - NTFY_ENABLE_LOGIN=${NTFY_ENABLE_LOGIN:-true}
      - NTFY_REQUIRE_LOGIN=${NTFY_REQUIRE_LOGIN:-true}
      - NTFY_AUTH_USERS=${NTFY_AUTH_USERS:-}
      - NTFY_AUTH_ACCESS=${NTFY_AUTH_ACCESS:-}
      - NTFY_AUTH_DEFAULT_ACCESS=${NTFY_AUTH_DEFAULT_ACCESS:-deny-all}
      - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL:-}
    volumes:
      - ntfy_data:/var/lib/ntfy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_tw_reuse=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  ntfy_data:
    name: ntfy_data_volume

networks:
  ntfy-network:
    name: ntfy_network
    driver: bridge
    internal: true