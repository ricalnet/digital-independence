services:
  jellyfin:
    image: ${JELLYFIN_IMAGE:-docker.io/jellyfin/jellyfin:latest}
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_BIND_ADDRESS:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096"
      - "${JELLYFIN_BIND_ADDRESS:-127.0.0.1}:${JELLYFIN_PORT_SSL:-8920}:8920"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_PATH:-./media}:/media:ro
      - /usr/share/fonts:/usr/local/share/fonts/custom:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${PUBLIC_URL:-http://localhost:8096}
      - COMPlus_EnableDiagnostics=0
      - TZ=${TZ:-Asia/Jakarta}
      - DOTNET_SYSTEM_IO_DISABLEFILELOCKING=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: ${MEMORY_LIMIT:-2g}
    mem_reservation: ${MEMORY_RESERVATION:-512m}
    cpus: ${CPU_LIMIT:-2.0}
    pids_limit: 500
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512M
      - /run:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=128M
      - /var/cache/jellyfin:rw,noexec,nosuid,size=512M
    devices:
      - /dev/dri/card0:/dev/dri/card0:rwm
      - /dev/dri/renderD128:/dev/dri/renderD128:rwm
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_syncookies=1
      - net.ipv4.tcp_tw_reuse=1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - jellyfin-network

volumes:
  jellyfin_config:
    name: jellyfin_config
  jellyfin_cache:
    name: jellyfin_cache

networks:
  jellyfin-network:
    name: jellyfin_network
    driver: bridge