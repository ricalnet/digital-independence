services:
  jellyfin:
    image: ${JELLYFIN_IMAGE:-docker.io/jellyfin/jellyfin:latest}
    container_name: jellyfin
    user: 1000:1000
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - type: bind
        source: ${CONFIG_PATH:-./config}
        target: /config
      - type: bind
        source: ${CACHE_PATH:-./cache}
        target: /cache
      - type: bind
        source: ${MEDIA_PATH:-./media}
        target: /media
      - type: bind
        source: /usr/share/fonts
        target: /usr/local/share/fonts/custom
        read_only: true
    environment:
      - JELLYFIN_PublishedServerUrl=${PUBLIC_URL:-http://localhost:8096}
      - COMPlus_EnableDiagnostics=0
      - TZ=${TZ:-Asia/Jakarta}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    mem_limit: ${MEMORY_LIMIT:-2g}
    cpus: ${CPU_LIMIT:-2.0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
      - /run:rw,noexec,nosuid,size=64M
    devices:
      - /dev/dri/card0:/dev/dri/card0:rwm
      - /dev/dri/renderD128:/dev/dri/renderD128:rwm
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_syncookies=1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - jellyfin-network

networks:
  jellyfin-network:
    driver: bridge
