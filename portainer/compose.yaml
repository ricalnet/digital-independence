services:
  portainer:
    container_name: portainer
    image: ${PORTAINER_IMAGE:-docker.io/portainer/portainer-ce:latest}
    restart: unless-stopped
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - portainer_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:9444:9000"
    environment:
      - TZ=${TZ:-UTC}
      - PORTAINER_LOGS_LEVEL=${PORTAINER_LOGS_LEVEL:-info}
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:9000/ping",
    #     ]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 30s
    mem_limit: 300m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

volumes:
  portainer_data:
    name: portainer_data
    external: false

networks:
  default:
    name: portainer_network
    driver: bridge
    internal: false
