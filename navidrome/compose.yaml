services:
  navidrome:
    image: ${NAVIDROME_IMAGE:-docker.io/deluan/navidrome:latest}
    container_name: navidrome
    ports:
      - "${NAVIDROME_BIND_ADDRESS:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533"
    restart: unless-stopped
    volumes:
      - navidrome_data:/data
      - ${MUSIC_PATH:-./music}:/music:ro
    environment:
      - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
      - ND_SCAN_INTERVAL=${ND_SCAN_INTERVAL:-1h}
      - ND_SESSION_TIMEOUT=${ND_SESSION_TIMEOUT:-24h}
      - ND_JWT_SECRET=${ND_JWT_SECRET:-}
      - ND_COVER_ART_PRIORITY=${ND_COVER_ART_PRIORITY:-embedded,cover.*,folder.*,front.*}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    mem_swappiness: 10
    oom_score_adj: -100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - navidrome-network
    stop_grace_period: 30s
    stop_signal: SIGTERM

volumes:
  navidrome_data:
    name: navidrome_data

networks:
  navidrome-network:
    name: navidrome-network
    driver: bridge