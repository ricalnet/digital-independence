services:
  redis:
    container_name: searxng-redis
    image: ${SEARXNG_REDIS_IMAGE:-docker.io/valkey/valkey:alpine}
    command: >
      valkey-server
      --save 30 1
      --loglevel warning
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --protected-mode yes
      --bind 0.0.0.0
      --port 6379
      --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    read_only: true
    tmpfs:
      - /run
      - /tmp

  searxng:
    container_name: searxng
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - SEARXNG_DEBUG=${SEARXNG_DEBUG:-false}
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@searxng-redis:6379/0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    stop_grace_period: 30s

networks:
  searxng:
    driver: bridge

volumes:
  valkey-data:
    driver: local
  searxng-data:
    driver: local